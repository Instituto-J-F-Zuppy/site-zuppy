<!DOCTYPE html>

<html lang="pt-br">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Meus pedidos | Zuppy!</title>
    <link href="css/style.css" rel="stylesheet" />
    <link href="css/meus-pedidos.css" rel="stylesheet" />
    <link href="css/acessibilidade.css" rel="stylesheet" />
</head>

<body>

    <header>

        <div class="header">

            <a class="logo-area" href="index.html">
                <img alt="Logo Zuppy" id="logo" src="img/logo_zuppy.png" />
            </a>

            <div class="search-box">
                <img alt="" id="lupa_icon" src="img/lupa_icon.png" />
                <input id="searchInput" placeholder="Encontre seu próximo brinquedo favorito..." type="text" />
            </div>

            <div class="login" id="areaLogin">

                <a href="cadastro.html" id="linkCadastrar">
                    Cadastrar-se
                </a>

                <a href="login.html" id="linkEntrar">
                    <button id="botao-entrar">
                        Entrar
                    </button>
                </a>

                <div id="areaUsuarioLogado" style="display: none; align-items: center; gap: 14px;">
                    <span id="saudacaoUsuario"></span>
                    <button id="botaoSair" type="button">Sair</button>
                </div>

            </div>

        </div>

        <div class="header2" id="headerBottom">

            <div class="cep">
                <img alt="" id="loc_icon" src="img/loc_icon.png" />

                <span>
                    Entregar em:
                    <strong>00000-000</strong>
                </span>

            </div>

            <nav class="nav-menu">
                <a href="todos-produtos.html">Todos os produtos</a>
                <a href="todos-produtos.html?personagem=Anna">Anna</a>
                <a href="todos-produtos.html?personagem=Emanuelly">Emanuelly</a>
                <a href="todos-produtos.html?personagem=Julio">Julio</a>
                <a href="todos-produtos.html?personagem=Sena">Sena</a>
                <a href="todos-produtos.html?personagem=Shiniti">Shiniti</a>
            </nav>

            <div class="botao-icones">

                <a aria-label="Página de acessibilidade" class="botao-icone-cabecalho" href="acessibilidade.html">
                    <img alt="" src="img/acessibilidade_icon.png" />
                </a>

                <img alt="Fale com a gente pelo WhatsApp" src="img/whatsapp_icon.png" />

                <a class="link-carrinho-header" href="carrinho.html">
                    <img alt="Meu Carrinho" src="img/lilcar.png" />
                    <span class="carrinho-badge"></span>
                </a>

            </div>

        </div>

    </header>

    <main class="pagina-pedidos">

        <nav aria-label="Navegação estrutural" class="breadcrumb-checkout">

            <a href="index.html">
                Início
            </a>

            <span aria-hidden="true">
                &lt;
            </span>

            <strong>
                Meus pedidos
            </strong>

        </nav>

        <h1 class="titulo-checkout">
            Meus pedidos
        </h1>

        <p aria-live="polite" class="mensagem-carrinho" id="pedidosRequerLogin" role="status" style="display: none;">
            Você precisa estar logado para ver seus pedidos.
            <a href="login.html">Entrar</a>.
        </p>

        <div aria-live="polite" class="pedidos-carregando" id="pedidosCarregando" role="status" style="display: none;">

            <div aria-hidden="true" class="circulo-carregamento"></div>

            <p>
                Carregando seus pedidos...
            </p>

        </div>

        <p aria-live="polite" class="mensagem-carrinho" id="pedidosVazio" role="status" style="display: none;">
            Você ainda não fez nenhum pedido.
            <a href="todos-produtos.html">Ver produtos</a>.
        </p>

        <p aria-live="assertive" class="mensagem-carrinho" id="pedidosErro" role="alert" style="display: none;"></p>

        <div id="listaPedidos"></div>

    </main>

    <script src="js/carrinho-store.js"></script>
    <script src="js/sessao.js"></script>
    <script src="js/meus-pedidos.js"></script>
    <script src="js/acessibilidade.js"></script>

</body>

</html>
