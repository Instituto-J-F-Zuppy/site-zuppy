<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Carrinho | Zuppy!</title>

    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/carrinho.css">
</head>

<body>

    <header>

        <div class="header">

            <a href="index.html" class="logo-area">
                <img src="img/logo_zuppy.png" alt="Logo Zuppy" id="logo">
            </a>

            <div class="search-box">

                <img src="img/lupa_icon.png" alt="" id="lupa_icon">

                <input type="text" id="searchInput" placeholder="Encontre seu próximo brinquedo favorito...">

            </div>

            <div class="login">

                <a href="cadastro.html">
                    Cadastrar-se
                </a>

                <a href="login.html">
                    <button id="botao-entrar">
                        Entrar
                    </button>
                </a>

            </div>

        </div>

        <div class="header2" id="headerBottom">

            <div class="cep">

                <img src="img/loc_icon.png" alt="" id="loc_icon">

                <span>
                    Entregar em:
                    <strong>00000-000</strong>
                </span>

            </div>

            <nav class="nav-menu">

                <a href="todos-produtos.html">Todos os produtos</a>
                <a href="#">Anna</a>
                <a href="#">Emanuelly</a>
                <a href="#">Julio</a>
                <a href="#">Sena</a>
                <a href="#">Shiniti</a>

            </nav>

            <div class="botao-icones">

                <img src="img/acessibilidade_icon.png" alt="Sobre Acessibilidade">

                <img src="img/whatsapp_icon.png" alt="Fale com a gente pelo WhatsApp">

                <a href="carrinho.html" class="link-carrinho-header">
                    <img src="img/lilcar.png" alt="Meu Carrinho">
                    <span class="carrinho-badge"></span>
                </a>

            </div>

        </div>

    </header>

    <main class="pagina-carrinho">

        <nav class="breadcrumb-carrinho" aria-label="Navegação estrutural">

            <a href="index.html">
                Início
            </a>

            <span aria-hidden="true">&lt;</span>

            <strong>
                Carrinho
            </strong>

        </nav>

        <div class="titulo-carrinho">

            <h1>Carrinho</h1>

            <span id="quantidadeItensTitulo">
                0 itens
            </span>

        </div>

        <div class="conteudo-carrinho">

            <section class="lista-carrinho">
                <div class="selecionar-todos">
                    <label>

                        <input type="checkbox" id="selecionarTodos">

                        <span class="checkbox-carrinho"></span>

                        <span>
                            Selecionar tudo
                        </span>

                    </label>

                </div>

                <div id="itensCarrinho">
                </div>

                <div class="carrinho-vazio" id="carrinhoVazio">

                    <h2>Seu carrinho está vazio</h2>

                    <p>
                        Adicione brinquedos para continuar sua aventura.
                    </p>

                    <a href="todos-produtos.html">
                        Ver produtos
                    </a>

                </div>

            </section>

            <aside class="resumo-carrinho">
                <div class="resumo-card">
                    <div class="linha-resumo">

                        <span id="textoProdutos">
                            Produtos (8)
                        </span>

                        <div class="valores-produtos">

                            <del id="valorAntigoResumo">
                                R$376,40
                            </del>

                            <strong id="valorProdutos">
                                R$330,00
                            </strong>

                        </div>

                    </div>

                    <div class="linha-resumo envio-resumo">

                        <span>Envio</span>

                        <strong>Grátis</strong>

                    </div>

                    <div class="area-cupom">

                        <button type="button" id="abrirCupom">
                            Cupom de desconto
                        </button>

                        <div class="campo-cupom" id="campoCupom">

                            <input type="text" id="codigoCupom" placeholder="Digite seu cupom">

                            <button type="button" id="aplicarCupom">
                                Aplicar
                            </button>

                        </div>

                        <p class="mensagem-cupom" id="mensagemCupom" role="status"></p>

                    </div>
                    <div class="linha-resumo total-resumo">

                        <span>Total</span>

                        <strong id="valorTotal">
                            R$0,00
                        </strong>
                    </div>
                </div>
                <button type="button" class="botao-proximo-carrinho" id="botaoProximo">Próximo ></button>
            </aside>
        </div>

    </main>
    <script src="js/carrinho-store.js"></script>
    <script src="js/carrinho.js"></script>
</body>

</html>
