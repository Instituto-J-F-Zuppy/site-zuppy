<!DOCTYPE html>

<html lang="pt-br">
<head>
<meta charset="utf-8"/>

<link href="css/style.css" rel="stylesheet"/>
<link href="css/carrinho.css" rel="stylesheet"/>

<body>
<header>
<div class="header">
<a class="logo-area" href="index.html">
<img alt="Logo Zuppy" id="logo" src="img/logo_zuppy.png"/>
</a>
<div class="search-box">
<img alt="" id="lupa_icon" src="img/lupa_icon.png"/>
<input id="searchInput" placeholder="Encontre seu próximo brinquedo favorito..." type="text"/>
</div>
<div class="login" id="areaLogin">
<a href="cadastro.html" id="linkCadastrar">
                    Cadastrar-se
                </a>
<a href="login.html" id="linkEntrar">
<button id="botao-entrar">
                        Entrar
                    </button>
</a>
<div id="areaUsuarioLogado" style="display: none; align-items: center; gap: 14px;">
<span id="saudacaoUsuario"></span>
<button id="botaoSair" type="button">Sair</button>
</div>
</div>
</div>
<div class="header2" id="headerBottom">
<div class="cep">
<img alt="" id="loc_icon" src="img/loc_icon.png"/>
<span>
                    Entregar em:
                    <strong>00000-000</strong>
</span>
</div>
<nav class="nav-menu">
<a href="todos-produtos.html">Todos os produtos</a>
<a href="todos-produtos.html?personagem=Anna">Anna</a>
<a href="todos-produtos.html?personagem=Emanuelly">Emanuelly</a>

<a href="todos-produtos.html?personagem=Sena">Sena</a>
<a href="todos-produtos.html?personagem=Shiniti">Shiniti</a>
</nav>
<div class="botao-icones">

<img alt="Fale com a gente pelo WhatsApp" src="img/whatsapp_icon.png"/>
<a class="link-carrinho-header" href="carrinho.html">
<img alt="Meu Carrinho" src="img/lilcar.png"/>
<span class="carrinho-badge"></span>
</a>
</div>
</div>
</header>
<main class="pagina-carrinho">
<nav aria-label="Navegação estrutural" class="breadcrumb-carrinho">
<a href="index.html">
                Início
            </a>
<span aria-hidden="true">&lt;</span>
<strong>
                Carrinho
            </strong>
</nav>
<div class="titulo-carrinho">
<h1>Carrinho</h1>
<span id="quantidadeItensTitulo">
                8 itens
            </span>
</div>
<div class="conteudo-carrinho">
<section class="lista-carrinho">
<div class="selecionar-todos">
<label>
<input id="selecionarTodos" type="checkbox"/>
<span class="checkbox-carrinho"></span>
<span>
                            Selecionar tudo
                        </span>
</label>
</div>
<div id="itensCarrinho">
</div>
<div class="carrinho-vazio" id="carrinhoVazio">
<h2>Seu carrinho está vazio</h2>
<p>
                        Adicione brinquedos para continuar sua aventura.
                    </p>
<a href="todos-produtos.html">
                        Ver produtos
                    </a>
</div>
</section>
<aside class="resumo-carrinho">
<div class="resumo-card">
<div class="linha-resumo">
<span id="textoProdutos">
                            Produtos (8)
                        </span>
<div class="valores-produtos">
<del id="valorAntigoResumo">
                                R$376,40
                            </del>
<strong id="valorProdutos">
                                R$330,00
                            </strong>
</div>
</div>
<div class="linha-resumo envio-resumo">
<span>Envio</span>
<strong>Grátis</strong>
</div>
<div class="area-cupom">
<button id="abrirCupom" type="button">
                            Cupom de desconto
                        </button>
<div class="campo-cupom" id="campoCupom">
<input id="codigoCupom" placeholder="Digite seu cupom" type="text"/>
<button id="aplicarCupom" type="button">
                                Aplicar
                            </button>
</div>
<p class="mensagem-cupom" id="mensagemCupom" role="status"></p>
</div>
<div class="linha-resumo total-resumo">
<span>Total</span>
<strong id="valorTotal">
                            R$330,00
                        </strong>
</div>
</div>
<button class="botao-proximo-carrinho" id="botaoProximo" type="button">Próximo &gt;</button>
</aside>
</div>
</main>
<script src="js/produtos-data.js"></script>
<script src="js/carrinho-store.js"></script>
<script src="js/sessao.js"></script>
<script src="js/carrinho.js"></script>
