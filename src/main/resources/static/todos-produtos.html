<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Todos os produtos | Zuppy!</title>
<link href="css/style.css" rel="stylesheet"/>
<link href="css/todos-produtos.css" rel="stylesheet"/>
<link href="css/acessibilidade.css" rel="stylesheet"/></head>
<body>
<header>
<div class="header">
<a class="logo-area" href="index.html">
<img alt="Logo Zuppy" id="logo" src="img/logo_zuppy.png"/>
</a>
<div class="search-box">
<img alt="" id="lupa_icon" src="img/lupa_icon.png"/>
<input aria-label="Pesquisar produtos" id="searchInput" placeholder="Encontre seu próximo brinquedo favorito..." type="text"/>
</div>
<div class="login" id="areaLogin">
<a href="cadastro.html" id="linkCadastrar">
                    Cadastrar-se
                </a>
<a href="login.html" id="linkEntrar">
<button id="botao-entrar">
                        Entrar
                    </button>
</a>
<div id="areaUsuarioLogado" style="display: none; align-items: center; gap: 14px;">
<span id="saudacaoUsuario"></span>
<button id="botaoSair" type="button">Sair</button>
</div>
</div>
</div>
<div class="header2" id="headerBottom">
<div class="cep">
<img alt="" id="loc_icon" src="img/loc_icon.png"/>
<span>
                    Entregar em:
                    <strong>00000-000</strong>
</span>
</div>
<nav class="nav-menu">
<a href="todos-produtos.html">Todos os produtos</a>
<a href="todos-produtos.html?personagem=Anna">Anna</a>
<a href="todos-produtos.html?personagem=Emanuelly">Emanuelly</a>
<a href="todos-produtos.html?personagem=Julio">Julio</a>
<a href="todos-produtos.html?personagem=Sena">Sena</a>
<a href="todos-produtos.html?personagem=Shiniti">Shiniti</a>
</nav>
<div class="botao-icones">
<a aria-label="Página de acessibilidade" class="botao-icone-cabecalho" href="acessibilidade.html"><img alt="" src="img/acessibilidade_icon.png"/></a>
<img alt="Fale com a gente pelo WhatsApp" src="img/whatsapp_icon.png"/>
<a class="link-carrinho-header" href="carrinho.html"><img alt="Meu Carrinho" src="img/lilcar.png"/><span class="carrinho-badge"></span></a>
</div>
</div>
</header>
<main class="pagina-produtos">
<nav aria-label="Navegação estrutural" class="breadcrumb-produtos">
<a href="index.html">
                Início
            </a>
<span aria-hidden="true">&lt;</span>
<strong>
                Todos os produtos
            </strong>
</nav>
<div class="conteudo-produtos">
<aside class="painel-filtros">
<h2>Filtrar por</h2>
<div class="filtro-ordenacao">
<button class="botao-filtro" id="ordenarMenorPreco" type="button">
<img alt="" class="icons_filtro" src="img/menor-preco_icon.png"/>Menores preços
                    </button>
<button class="botao-filtro" id="ordenarMaisVendidos" type="button">
<img alt="" class="icons_filtro" src="img/mais-vendido_icon.png"/>Mais vendidos
                    </button>
</div>
<div class="grupo-filtro">
<h3>Faixa de preço</h3>
<div class="preco-selecionado" id="precoSelecionado">
                        R$ 50,00
                    </div>
<input aria-label="Preço máximo" id="filtroPreco" max="1000" min="0" step="10" type="range" value="1000"/>
<div class="valores-preco">
<span>R$ 3,00</span>
<span>R$ 1.000,00</span>
</div>
</div>
<div class="grupo-filtro">
<h3>Brinquedos</h3>
<div class="busca-filtro">
<img alt="" src="img/lupa_icon.png"/>
<input aria-label="Buscar brinquedo nos filtros" id="buscaFiltro" placeholder="Buscar brinquedo..." type="text"/>
</div>
<div class="opcoes-personagens">
<label>
<input class="filtro-personagem" type="checkbox" value="Adriel"/>
<span>Adriel</span>
</label>
<label>
<input class="filtro-personagem" type="checkbox" value="Anna"/>
<span>Anna</span>
</label>
<label>
<input class="filtro-personagem" type="checkbox" value="Emanuelly"/>
<span>Emanuelly</span>
</label>
<label>
<input class="filtro-personagem" type="checkbox" value="Júlio"/>
<span>Júlio</span>
</label>
<label>
<input class="filtro-personagem" type="checkbox" value="Sena"/>
<span>Sena</span>
</label>
<label>
<input class="filtro-personagem" type="checkbox" value="Shiniti"/>
<span>Shiniti</span>
</label>
<label>
<input class="filtro-personagem" type="checkbox" value="Especiais"/>
<span>Especiais</span>
</label>
</div>
</div>
</aside>
<section class="area-listagem">
<div class="cabecalho-listagem">
<h1>Todos os produtos</h1>
<p>
                        Achamos
                        <strong id="quantidadeProdutos">36</strong>
                        opções para você
                    </p>
</div>
<div class="grade-produtos" id="gradeProdutos">
</div>
<p class="nenhum-produto" id="nenhumProduto" role="status">Nenhum produto encontrado com esses filtros.
                </p>
</section>
</div>
</main>
<script src="js/produtos-data.js"></script>
<script src="js/favoritos-store.js"></script>
<script src="js/carrinho-store.js"></script>
<script src="js/sessao.js"></script>
<script src="js/todos-produtos.js"></script>
<script src="js/acessibilidade.js"></script></body>
</html>
